name: savj_mobile
description: SAVJ - Hyperlocal Task Marketplace and Community Volunteering
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & Dependency Injection
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.2.0
  
  # Networking
  dio: ^5.4.2
  
  # Local Storage / Cache
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # UI & Styling
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
flutter:
  uses-material-design: true
